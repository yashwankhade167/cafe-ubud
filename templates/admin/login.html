<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login · Cafe Ubud</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Cinzel:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-lt: #E8D5A3; --bark: #1A1208;
    --panel: #211A10; --cream: #FAF6EF; --muted: rgba(250,246,239,.5);
    --border: rgba(201,168,76,.18); --red: #D97B6C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2C1A0E 0%, #1A1208 60%, #0D0905 100%);
    color: var(--cream); font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    width: 380px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 48px 40px;
  }
  .login-logo {
    font-family: 'Cinzel', serif; font-size: 1.3rem; letter-spacing: .3em;
    color: var(--gold); text-align: center; margin-bottom: 8px;
  }
  .login-sub {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 1rem; color: var(--muted); text-align: center; margin-bottom: 36px;
  }
  label { font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display:block; margin-bottom: 8px; }
  input {
    width: 100%; background: #15110B; border: 1px solid var(--border);
    color: var(--cream); padding: 12px 14px; border-radius: 4px;
    font-size: .9rem; margin-bottom: 22px; outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    width: 100%; background: var(--gold); border: none; color: var(--bark);
    font-family: 'Cinzel', serif; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase;
    padding: 14px; border-radius: 4px; cursor: pointer; transition: background .2s;
  }
  button:hover { background: var(--gold-lt); }
  .flash { background: rgba(217,123,108,.1); border-left: 3px solid var(--red); color: var(--red);
    padding: 10px 16px; font-size: .8rem; margin-bottom: 22px; border-radius: 4px; }
  .hint { text-align: center; margin-top: 24px; font-size: .7rem; color: rgba(250,246,239,.3); }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">CAFE UBUD</div>
    <div class="login-sub">Admin Dashboard</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Sign In</button>
    </form>
    <div class="hint">Demo login — admin / ubud2026</div>
  </div>
</body>
</html>
